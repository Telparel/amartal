name: Build Amarthaloe JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Выгрузка кода репозитория
      uses: actions/checkout@v4

    - name: Установка Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Разрешение на запуск Gradle
      run: chmod +x gradlew

    - name: Сборка мода Amarthaloe
      uses: gradle/actions/setup-gradle@v3
      with:
        arguments: build

    - name: Сохранение готового .jar файла
      uses: actions/upload-artifact@v4
      with:
        name: Amarthaloe-Mod-JAR
        path: build/libs/*.jar